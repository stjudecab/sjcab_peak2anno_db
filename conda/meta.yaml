{% set name = "sjcab_peak2anno_db" %}
{% set version = load_file_regex(
    load_file="../src/sjcab_peak2anno_db/_version.py",
    regex_pattern="__version__ = [\\\"']([^\\\"']+)[\\\"']"
)[1] %}
{% if environ.get("SETUPTOOLS_SCM_PRETEND_VERSION") %}
{% set version = environ.get("SETUPTOOLS_SCM_PRETEND_VERSION") %}
{% endif %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python >=3.7
    - pip
    - setuptools >=61
    - setuptools-scm >=7,<8
    - wheel
  run:
    - python >=3.7

test:
  imports:
    - sjcab_peak2anno_db
  commands:
    - sjcab-peak2anno-db list

about:
  summary: Gene-backed peak-to-annotation BED resources for SJ/CAB workflows.
  license: MIT
  home: https://github.com/stjudecab/sjcab_peak2anno_db
  dev_url: https://github.com/stjudecab/sjcab_peak2anno_db
  doc_url: https://github.com/stjudecab/sjcab_peak2anno_db/blob/main/README.md

extra:
  issue_url: https://github.com/stjudecab/sjcab_peak2anno_db/issues
